# Global mise config: https://mise.jdx.dev/configuration.html
#
# - Tools listed here are installed for your whole account via `mise install`
#   and live on PATH everywhere (`mise activate` in fish handles this).
# - Per-project tools: run `mise use <tool>` inside a project to create/extend
#   its own mise.toml (replaces devenv/direnv).
# - go/rust toolchains come from here too; binaries you build/install
#   (cargo install, go install) land in ~/.cargo/bin and ~/go/bin, both on PATH.

# Explicitly use precompiled binaries everywhere. On NixOS (and Alpine) mise
# implicitly defaults to all_compile=true, which compiles node/python/ruby/erlang
# from source — that fails on a bare machine (no system gcc/make/python; node's
# ./configure dies with "exec: python: not found"). Precompiled glibc binaries
# need nix-ld on NixOS (see README onboarding step 1).
[settings]
all_compile = false

[tools]
# toolchains
go = "latest"
node = "latest"
# rust = "latest"   # uncomment when you need the rust toolchain on a machine

# shell environment
starship = "latest"
zoxide = "latest"
atuin = "latest"

# core CLIs
eza = "latest"
fd = "latest"
ripgrep = "latest"
bat = "latest"
jq = "latest"
gh = "latest"
uv = "latest"

# tangled.org CLI (an analogue to gh; builds github.com/alyraffauf/tg from
# source via the go backend, exposing the `tg` binary). Auth is a separate
# step: tg auth login <handle>.
"go:github.com/alyraffauf/tg/cmd/tg" = "latest"

# editors / vcs
neovim = "latest"
jj = "latest"

# AI coding agent — OpenCode 2 (beta). Installs the `opencode2` binary.
# allow_builds permits the package's postinstall script (which selects the
# native platform binary); mise otherwise installs npm packages with scripts
# disabled, and opencode2 errors out without it.
"npm:@opencode-ai/cli" = { version = "beta", allow_builds = ["@opencode-ai/cli"] }

# mise internals (task/completion support)
usage = "latest"

# To add more tools, run `mise registry | grep <name>` to find the backend,
# add it here (or `mise use -g <tool>` which edits this file), then `mise install`.
#
# polytoken is intentionally NOT here: it isn't in mise's registry and manages
# its own updates. It's installed to ~/.local/bin by
# run_once_install-polytoken.sh (chezmoi) and updated by `mise run update`.

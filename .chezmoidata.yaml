# Shared, non-secret defaults used by chezmoi templates.
# Machine-specific settings (machine type) live in ~/.config/chezmoi/chezmoi.toml,
# created by .chezmoi.toml.tmpl on `chezmoi init`.

# warm-burnout theme external. Used by .chezmoiexternal.yaml (the clone source)
# and run_onchange_sync-warm-burnout-remote.sh (which repoints already-cloned
# checkouts when this changes — chezmoi's git-repo externals don't do that on
# their own). Change the url here to roll it out everywhere on the next apply.
warm_burnout:
  url: https://github.com/MattKunze/warm-burnout.git
  branch: main

personal:
  git:
    name: Matt Kunze
    email: matt.kunze@gmail.com
  atuin_sync: https://home.shypan.st/atuin/

work:
  git:
    name: Kunze, Matt
    email: Matt.Kunze+nextera@nexteraenergy.com
  atuin_sync: https://api.atuin.sh
